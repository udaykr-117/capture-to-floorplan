# Every threshold has a one-line justification. Do not change a value to improve a result
# without logging the before/after in JOURNAL.md (CLAUDE.md rule 4).
# Only values already decided are here. New ones are added when the code that needs them exists.

stray:
  rgb_width: 1920        # camera_matrix.csv is at RGB resolution; printed: cv2 reports 1920x1440 on all 3 videos
  rgb_height: 1440       # same source; reference stray_visualize.py L79 scales with 1920/1440
  frame_stride: 5        # task brief default; ~4.3 fps keeps the cloud dense while limiting memory
  confidence_min: 2      # task brief default (0/1/2 scale); re-test 1 for ceilings (CLAUDE.md)
  depth_min_m: 0.1       # task brief default; closer returns are unreliable
  depth_max_m: 5.0       # task brief default; far returns are noisier
  voxel_m: 0.02          # task brief default; 2 cm matches the best opening/ceiling gate granularity
  flush_every_frames: 100  # memory bound only: merge+voxelise every 100 frames; only changes the cloud via voxel averaging order

scene:
  normal_voxel_m: 0.04         # analysis cloud: 2x the capture voxel, ~4x fewer points, enough neighbours per normal; same value as the session-1 wall probe
  normal_radius_m: 0.12        # normal neighbourhood; same as session-1 wall probe (not tuned)
  normal_max_nn: 40            # cap on neighbours so dense areas do not slow the estimate
  vertical_normal_max: 0.2     # |n_up| below this counts as a vertical surface (same as checks.wall_normal_vertical_max)
  horizontal_normal_min: 0.9   # |n_up| above this counts as a horizontal surface (floor, ceiling, table tops)

align:
  floor_below_camera_m: 0.5    # floor candidates must be >= 0.5 m below every camera position (phone is held above hip height)
  floor_hist_bin_m: 0.01       # 1 cm height bins resolve the 3-7 cm floor spread seen in M1
  floor_peak_min_rel: 0.4      # a floor peak needs >= 40% of the strongest peak below the camera; the floor is the LOWEST such peak
  floor_refine_halfwidth_m: 0.03  # floor height = median of points within +-3 cm of the chosen peak
  yaw_peak_window_deg: 10      # wall yaw = 4-theta circular mean of normals within +-10 deg of the histogram peak
  yaw_max_residual_deg: 1.0    # after rotating, the wall direction must be within 1 deg of an axis or alignment is rejected

walls:
  slab_above_floor_m: [0.3, 1.6]  # above floor clutter and baseboards, below most ceilings and lintels (same slab as the M1 wall probe)
  normal_axis_max_deg: 15      # a point supports an axis-aligned wall if its horizontal normal is within 15 deg of the axis
  hist_bin_m: 0.02             # 2 cm bins for the wall-offset histogram (= capture voxel)
  peak_min_support_m2: 0.5     # a wall plane needs >= 0.5 m2 of surface (converted to points with the analysis voxel area)
  plane_min_separation_m: 0.06 # two planes closer than 6 cm are one plane; thin partitions (>= ~9 cm) keep both faces
  plane_tol_m: 0.03            # points within +-3 cm of a peak belong to the plane; offset = their median
  along_cell_m: 0.05           # cell size when measuring where along the wall the plane has support
  along_cell_min_points: 5     # cell counts as supported with >= 5 analysis points (about 12% of the slab height)
  gap_merge_m: 1.2             # gaps shorter than 1.2 m stay inside one wall run (doorways are bridged, found later as openings)
  min_run_length_m: 0.5        # runs shorter than 0.5 m are noise or furniture edges
  coverage_cell_m: 0.10        # cell size for the height-coverage check
  min_height_coverage: 0.6     # a run is a structural wall if its supported columns fill >= 60% of the slab height; lower = furniture

rooms:
  cell_m: 0.05                 # 5 cm map cells: well below a door width, half the normal radius
  floor_band_m: 0.20           # floor evidence = horizontal points within +-20 cm of the floor height (was 0.08: dropped drifted floor, M2 log); furniture under 20 cm is negligible
  fan_bin_deg: 0.5             # angular bin of a visibility fan; ~2 depth pixels at fx=213 (0.27 deg per pixel)
  fan_gap_bins: 4              # empty angular gaps up to 2 deg stay inside one fan (sparse far hits)
  fan_min_frames: 2            # a cell counts as carved free space if >= 2 frames saw through it (drops single-frame spikes)
  camera_free_radius_m: 0.35   # the person carrying the phone occupies ~0.35 m of free floor around the camera
  barrier_half_width_m: 0.05   # wall runs are drawn 10 cm wide when used as barriers
  fill_hole_max_m2: 4.0        # unobserved holes fully enclosed by floor and under 4 m2 are furniture, not walls
  seed_min_dist_m: 0.5         # room core is >= 0.5 m from any barrier; doorways up to 1.0 m wide have a max distance < 0.5 m
  min_room_area_m2: 1.5        # smaller regions are merged into their neighbour (closets are kept by the polygon step)
  min_room_width_m: 0.6        # opening by a 0.3 m radius removes tails narrower than 0.6 m (leaks through windows, doors)
  rect_min_fraction: 0.35      # a plane-grid rectangle joins a room if >= 35% of its cells are that room; the barrier trims ~7 cm per wall side, so wall-thickness slivers fall below it
  virtual_line_min_len_m: 0.8  # a straight stretch of room edge >= 0.8 m with no wall plane within the tolerance becomes a virtual wall line
  virtual_line_plane_tol_m: 0.15  # ...tolerance: the mask edge sits within ~10 cm of the true face
  closing_m: 0.15              # slits narrower than 0.3 m inside a room polygon (between two nearby planes) are closed
  hole_max_m2: 1.0             # holes smaller than 1 m2 inside a room polygon (columns, furniture) are filled

ceiling:
  range_above_floor_m: [1.8, 4.5]  # habitable ceilings: below 1.8 m is door tops and furniture; above 4.5 m is past the 5 m depth range from a handheld phone
  hist_bin_m: 0.01             # 1 cm height bins, same resolution as the floor histogram
  peak_tol_m: 0.03             # points within +-3 cm of a peak belong to that ceiling level
  cell_m: 0.05                 # coverage is counted in 5 cm map cells so many points in one cell count once
  min_coverage: 0.2            # at least 20% of the room's area must have ceiling points at the peak height, else unmeasurable
  min_area_m2: 1.0             # and at least 1 m2 absolute
  second_peak_rel: 0.5         # a second level with >= 50% of the best level's coverage ...
  second_peak_sep_m: 0.08      # ... more than 8 cm away makes the result ambiguous (dropped ceiling, slope, or drift)
  floor_min_points: 200        # fewer floor points than this in a room: fall back to the global floor and say so
  interval_sigma: 2.0          # interval half-width = 2 x robust sigma of local floor and ceiling spread; NOT calibrated yet

openings:
  cell_m: 0.02                 # 2 cm cells along the wall: the opening-width gate is 2 cm
  image_height_m: 2.6          # wall images cover floor to 2.6 m (door heads and windows are below this)
  wall_tol_m: 0.05             # points within +-5 cm of the plane are wall (door trim and slight plane tilt)
  through_beyond_m: 0.20       # a ray counts as passing through the plane only if its hit is >= 20 cm beyond it (drift doubles walls by 10-30 cm; M1 overlay)
  through_point_stride: 3      # use every 3rd hit per frame for ray crossings: 3x faster, still thousands of rays per metre of wall
  max_gap_bridge_m: 3.0        # runs of the same plane closer than 3 m are examined together (an opening can split a plane's runs)
  min_open_height_m: 0.4       # a column is open if it has >= 40 cm of continuous see-through height with no wall points
  min_opening_m: 0.45          # narrower openings are noise (a door is >= 0.6 m)
  max_opening_m: 3.0           # wider ones are not treated as doors
  merge_gap_m: 0.05            # open columns split by < 5 cm are one opening
  bounded_max_gap_m: 0.30      # an opening is framed by wall within 30 cm on both sides; otherwise it is the end of a wall (added after 3 m long phantom 'openings' on with_ceiling, M2 log)
  door_bottom_max_m: 0.15      # open down to within 15 cm of the floor = door / passage, else raised (window, pass-through). Briefly set to 0.35 on a wrong premise (sparse synthetic rays); with sensor-density rays a synthetic door reaches 0.10 m. Re-check on real doors

intervals:
  # PROVISIONAL and NOT calibrated: there is no ground truth. They are made conservative and are meant to be
  # replaced by quantiles of real errors (cross-capture disagreement in M3, benchmark in M7).
  scale_rel_sigma: 0.0         # relative uncertainty of the metric scale: 0 for LiDAR; the image tiers set it from their scale estimate (scale.py)
  sigma_k: 2.0                 # half-width = 2 x the robust spread of the wall points around the fitted plane (~95% if the spread were Gaussian noise)
  plane_position_sigma_m: 0.035  # systematic wall-plane position error added in quadrature to the fit spread. From M3: 42 facing-wall widths over the 3 capture pairs differ by a robust sigma of 7.1 cm = 2 x sqrt(2) x 3.5 cm (clean pair alone: 2.1 cm). A LOWER bound on error (two captures can share a bias) and fitted on these same samples; recalibrate against ground truth in M7
  virtual_end_halfwidth_m: 0.15  # a wall end with no fitted plane sits on the mask edge, good to ~15 cm
  unsupported_halfwidth_m: 0.10  # extra half-width per unit of (1 - wall support): a mostly unseen wall is a guess
  min_halfwidth_m: 0.01        # never report a half-width under 1 cm
  unobserved_area_weight: 0.5  # area outside observed free space counts as half wrong in the area interval
  min_area_rel: 0.01           # area half-width is at least 1% of the area
  adjacency_wall_m: 0.35       # rooms whose boundaries run within 35 cm (a wall thickness) for >= 0.5 m are adjacent
  adjacency_min_shared_m: 0.5

register:
  raster_cell_m: 0.05          # 5 cm cells for the coarse correlation that picks the 90-degree rotation and the shift
  icp_thresholds_m: [0.30, 0.15, 0.08, 0.05]  # trimmed ICP: pairs farther than this are ignored; shrinks from the correlation error (~10 cm) to the 5 cm fitness distance
  icp_max_iter: 40             # per threshold; stops earlier when the update is below 0.1 mm / 0.001 deg
  icp_max_points: 150000       # random subset of the moving wall points, for speed
  min_fitness_5cm: 0.5         # a registration is accepted if >= 50% of wall points land within 5 cm of the other capture; below that it is reported as failed
  plane_match_tol_m: 0.15      # wall segments match if their offsets differ by < 15 cm after registration (drift doubles walls by 10-30 cm, M1 overlay)
  plane_min_overlap_m: 0.5     # ... and overlap along the wall by >= 0.5 m
  baseline_min_m: 0.8          # width pairs: distance between two facing planes, at least a narrow room
  baseline_max_m: 10.0         # ... and at most a house length
  baseline_bins_m: [0.8, 2.0, 4.0, 6.0, 10.0]  # error is reported per baseline bin because drift grows with distance
  gate_abs_m: 0.01             # repeatability gate from the brief: within 1 cm ...
  gate_rel: 0.005              # ... or 0.5% of the wall length
  room_inside_fraction: 0.7    # a room's ceiling is taken from another capture only if >= 70% of the room lies inside one room of that capture

drift:
  enabled: true                # plane-anchored per-chunk correction (M4); false = poses used as-is
  chunk_frames: 40             # sampled frames per chunk (~9 s at stride 5): enough walls per chunk for a direction, short enough to follow drift
  min_vertical_points: 400     # a chunk needs this many vertical-surface analysis points to trust its wall direction
  min_resultant: 0.6           # ... and a 4-theta resultant length of at least 0.6 (walls agree on one direction)
  floor_min_points: 200        # a chunk needs this many floor points to trust its floor height
  yaw_median_chunks: 5         # median filter over 5 chunks: drift is slow, single-chunk jumps of ~2 deg (with_ceiling chunk 8) are measurement noise
  floor_median_chunks: 5       # same for floor height (one chunk of floor_only read +13 cm while its neighbours read 0..1 cm)
  max_yaw_deg: 6.0             # never rotate a chunk by more than 6 deg (largest drift seen in the diagnosis is 3.5 deg)
  max_floor_m: 0.15            # never shift a chunk's floor by more than 15 cm (largest seen is 8.5 cm)
  assoc_tol_m: 0.35            # two views of a wall are associated if their offsets differ by < 35 cm (drift reaches ~60 cm over a capture, M4 diagnosis)
  assoc_min_overlap_m: 0.5     # ... and overlap along the wall by >= 0.5 m, from the same side (so the two faces of a partition are not mixed up)
  smooth_weight: 0.1           # weight of 'neighbouring chunks move together' relative to one wall association (weight 1)
  prior_weight: 0.01           # weak pull of every shift to zero; only fixes the free global translation
  huber_m: 0.05                # associations with a residual above 5 cm are down-weighted (wrong matches)
  irls_iters: 4                # re-weighting rounds
  jump_correction: true        # spread odometry relocalization jumps back along the path (needs drift.enabled)
  use_yaw: true                # component switches for the M4 ablation: chunk heading correction ...
  use_shift: false             # ... chunk wall-position shifts: OFF by default. In the M4 component ablation it worsened the path start-end gap on both captures with a loop (35->41 cm, 19->23 cm) and the cleanest capture pair (median width difference 1.6->5.3 cm); it helped only floor_only's widths (22->31% within the gate). Few pairs: low power, so kept as an option
  use_floor: true              # ... and chunk floor levelling
  jump_speed_mps: 5.0          # a step faster than 5 m/s is a tracker snap, not motion (walking 0.5 m/s; clean captures never exceed 1.5 m/s; floor_only has 17 m/s)
  holdout_fraction: 0.2        # share of wall associations held out to check that the shifts generalise

sfm:
  frame_width_px: 960          # frames are resized to 960 px wide for SfM and depth (1920 px costs 4x with no gain in a 5 m room)
  video_fps: 5.0               # sampled frames per second of video (M1: 2.5 fps registered too few frames)
  focal_factor: 0.833          # prior focal length / longest image side: iPhone main camera; camera_matrix.csv gives 1599.7 px at 1920 px on all three samples
  sift_peak_threshold: 0.0067  # COLMAP default
  sift_max_features: 8192      # COLMAP default
  seq_overlap: 10              # COLMAP default: each frame is matched with the next 10
  guided_matching: false
  init_min_tri_angle_deg: 16.0 # COLMAP default
  min_registered: 3            # fewer registered images than this is not a reconstruction: the tier reports failure and no rooms

scale:
  # Measured on the registered stretches of two samples (M5): error of the depth-model scale +4.8% (single_room) and -26.0% (floor_only);
  # of the camera-height prior -17.0% and -19.8%; of the combination -10.8% and -21.7% (rms 17%). Two points only: treat as a rough order of magnitude.
  camera_height_m: 1.42        # median camera height above the floor over the three whole captures: 1.41, 1.40, 1.46 m
  camera_height_rel_sigma: 0.18  # the registered stretches had the phone at ~1.7 m (bias towards textured views near the ceiling): prior error rms 18.5%
  depth_rel_sigma_floor: 0.18  # depth-model scale error rms 18.6% over the two samples
  min_rel_sigma: 0.20          # the combined scale is never reported better than +-20% (1 sigma): its measured errors were -10.8% and -21.7%
  use_camera_height: true

depth:
  model: depth-anything/Depth-Anything-V2-Metric-Indoor-Small-hf   # Apache-2.0 per the upstream README for the Small model; the fine-tuned card has no licence field (DISCLOSURE.md)
  revision: 8078d68a9c75a972131914f6afd0c1723be0da7f               # pinned; same as scripts/fetch_models.sh
  min_sparse_points: 30        # an image needs >= 30 SfM points to align its depth scale
  ratio_trim_log: 0.4          # per-point depth ratios more than ln(1.5) from the median are outliers (wrong matches, flying pixels)
  stride: 4                    # back-project every 4th pixel: ~43k points per 960x720 frame, about the LiDAR density (49k)
  edge_rel: 0.08               # drop pixels where the relative depth gradient exceeds 8% per pixel (flying pixels at depth edges)
  min_depth_m: 0.3             # model depth range used (metres, model scale)
  max_depth_m: 6.0

checks:
  ransac_distance_m: 0.02      # brief for the loader task: plane distance threshold 0.02 (2 cm = voxel size)
  ransac_iterations: 2000      # enough for the largest planes at ~10^6 points; not tuned
  planes_reported: 6           # brief for the loader task: top 6 planes
  floor_normal_max_deg: 3.0   # pass criterion from the brief to the loader task: floor within ~3 deg of an axis
  ceiling_probe_min_above_floor_m: 1.8   # probe slab starts here; a plane exactly at this height is a cutoff artifact
  wall_slab_above_floor_m: [0.3, 1.6]    # slab used to look at walls: above floor clutter, below ceiling
  wall_normal_vertical_max: 0.2          # |n.up| below this counts as a vertical surface

refine:                        # M7 fix: room-local wall refinement (src/floorplan/rooms/refine.py). false = M6 behaviour (the "before" of the fix loop)
  enabled: true                # on after the M7 benchmark: 7 of 9 paired room dimensions agree better across captures, 2 worse (docs/fix_declaration.md)
  chunk_inside_min: 0.5        # a chunk belongs to a room visit if >= half of its camera positions are inside the room polygon
  min_visit_chunks: 2          # a visit of one chunk (~9 s) is too short to see opposite walls; keep the global planes then
  window_m: 0.15               # search +-15 cm around the global plane: same as register.plane_match_tol_m; per-chunk wall positions range ~14 cm (M7 H1)
  end_margin_m: 0.2            # ignore 20 cm at each wall end (corners mix the perpendicular wall)
  min_points: 40               # same as the M7 diagnosis: ~0.016 m2 of 2 cm voxels

damage:
  model: google/owlvit-base-patch32   # chosen in M1 for CPU (0.5-1 s per frame); zero-shot, no damage-specific training, so accuracy is untested
  keyframe_every: 25           # frames (multiple of stray.frame_stride): about one keyframe per 6 s of walking, ~200 per large capture, bounded CPU time
  score_min: 0.33              # negative control (scripts/m6_negative_control.py): the 3 samples have no damage; regions vanish from 0.14, the highest single false box was 0.322 -> 0.33 is above every false box seen (569 boxes). Was 0.10 (model-card example). Recall on real damage untested and probably lowered
  max_box_fraction: 0.5        # a box covering more than half of the image is a whole wall or the floor, not a damage patch
  surfaces: [wall, ceiling]    # report damage only on walls and ceilings: every prompt names a wall or ceiling, and on single_room the floor boxes were tile grout and a mat (decision made AFTER looking at that output, see JOURNAL M6)
  min_views: 2                 # a region must be detected in >= 2 keyframes (single-frame detections are the commonest false positives)
  plane_inlier_m: 0.04         # depth pixels within 4 cm of the box's fitted plane are the surface; others are background seen through the box
  min_plane_fraction: 0.5      # at least half of the box's depth pixels must lie on one plane, else the box is not on a single surface and is dropped
  cell_m: 0.05                 # surface raster cell for area and for merging detections of one patch seen in several frames
  horizontal_normal_min: 0.9   # same as scene.horizontal_normal_min: floor or ceiling plane
  vertical_normal_max: 0.3     # |n_up| below this is a wall (looser than scene.vertical_normal_max because a box plane fit is noisier than a cloud normal)
  wall_match_m: 0.10           # a damaged wall point is assigned to a room wall edge within 10 cm of its plane
  max_extent:                  # physical plausibility per class (m2 of surface; for cracks the longest box side in m). Chosen AFTER seeing 5-7 m2 'holes' in with_ceiling (JOURNAL M6); a hole bigger than a door is not a hole
    hole: 0.5
    mold: 2.0
    stain: 4.0
    peeling_paint: 4.0
    crack: 3.0
  classes:                     # class -> text prompts (all prompts of a class are queried; best score kept per box)
    stain: ["a water stain on a wall", "a water stain on a ceiling", "a brown stain"]
    mold: ["mold on a wall", "black mold"]
    crack: ["a crack in a wall", "a crack in a ceiling"]
    peeling_paint: ["peeling paint", "blistering paint"]
    hole: ["a hole in a wall", "a hole in a ceiling"]
