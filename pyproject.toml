[project]
name = "floorplan"
version = "0.1.0"
description = "Phone captures (photo / video / LiDAR) to measured whole-property floor plans with intervals"
readme = "README.md"
authors = [
    { name = "udaykr-117", email = "kvudaykumarreddy@google.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "open3d>=0.20.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "typer>=0.27.2",
]

[project.scripts]
plan = "floorplan.cli:app"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
models = [
    "pillow>=12.3.0",
    "pycolmap>=4.2.1",
    "torch>=2.14.1",
    "transformers>=5.18.0",
]
